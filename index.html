<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="small potatoes">
<title>small potatoes</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
</head>
<body>

<div class="app">
  <main class="screens">

    <!-- Each screen is a walk: one card at a time, then a closing button.
         The walk and the closed state swap places; the header stays. -->

    <section class="screen" id="screen-morning">
      <header class="welcome">
        <span class="mascot-wrap">
          <img class="welcome-mascot" src="icons/mascot-small.svg" alt="">
        </span>
        <h1 class="welcome-greeting">good morning</h1>
        <p class="welcome-quip" id="morning-quip"></p>
      </header>
      <p class="day-label"></p>

      <div class="walk" id="morning-walk">
        <div class="pages" id="morning-pages"></div>
        <div class="dots" id="morning-dots" aria-hidden="true"></div>
        <div class="walk-actions">
          <button class="link-btn" id="morning-back" type="button">back</button>
          <button class="btn btn-primary" id="morning-primary" type="button">next</button>
        </div>
      </div>

      <div class="closed" id="morning-closed" hidden>
        <p class="closed-line" id="morning-closed-line"></p>
        <button class="link-btn" id="morning-again" type="button">look again</button>
      </div>
    </section>

    <section class="screen" id="screen-evening">
      <header class="welcome">
        <span class="mascot-wrap">
          <img class="welcome-mascot" src="icons/mascot-small.svg" alt="">
          <span class="zzz" aria-hidden="true"><i>z</i><i>z</i><i>z</i></span>
        </span>
        <h1 class="welcome-greeting">good evening</h1>
        <p class="welcome-quip" id="evening-quip"></p>
      </header>
      <p class="day-label"></p>

      <div class="walk" id="evening-walk">
        <div class="pages" id="evening-pages"></div>
        <div class="dots" id="evening-dots" aria-hidden="true"></div>
        <div class="walk-actions">
          <button class="link-btn" id="evening-back" type="button">back</button>
          <button class="btn btn-primary" id="evening-primary" type="button">next</button>
        </div>
      </div>

      <div class="closed" id="evening-closed" hidden>
        <p class="closed-line" id="evening-closed-line"></p>
        <button class="link-btn" id="evening-again" type="button">look again</button>
      </div>
    </section>

  </main>

  <button class="update-banner" id="update-banner" type="button" hidden>
    a new version is ready. tap to reload
  </button>

  <nav class="tabbar" aria-label="sections">
    <a class="tab" href="#morning" data-tab="morning">morning</a>
    <a class="tab" href="#evening" data-tab="evening">evening</a>
  </nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
